name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: IdentiFi-Windows-Installer
          path: desktop-release/*.exe
          if-no-files-found: error
